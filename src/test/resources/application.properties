# Tests must never reach out to real job boards, and a nightly cron firing in
# the middle of a Testcontainers run would be a genuinely confusing failure.
jobhunt.sweep.enabled=false

# Pin the profile away from the developer's real .work/profile.json. Without
# this the suite passes or fails depending on whether that file happens to
# exist locally, because its presence switches scoring on at ingest.
jobhunt.profile-path=build/test-no-profile.json

# Auto-apply must never fire during tests: it opens a browser and, if live were
# ever true, would submit a real application. The form-filling tests drive
# Playwright directly against a local page instead.
jobhunt.autoapply.enabled=false
jobhunt.autoapply.live=false
jobhunt.applicant-path=build/test-no-applicant.json
